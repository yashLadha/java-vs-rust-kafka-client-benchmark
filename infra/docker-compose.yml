name: kbench

networks:
  kbench-net:
    name: kbench-net
    driver: bridge

services:
  kbench-kafka:
    image: apache/kafka:4.3.1
    container_name: kbench-kafka
    hostname: kbench-kafka
    networks:
      - kbench-net
    cpuset: "0-6,16-22"
    # tmpfs pages are charged to this memory cgroup and cannot be reclaimed (the host has no swap),
    # so 16g tmpfs + 4g heap + JVM native memory must all fit. memswap_limit equal to mem_limit
    # disables swap.
    mem_limit: 24g
    memswap_limit: 24g
    tmpfs:
      - /var/lib/kafka/data:size=16g,uid=1000,gid=1000,mode=0755
    environment:
      CLUSTER_ID: a2JlbmNoLWthZmthLTAwMQ
      KAFKA_HEAP_OPTS: "-Xms4g -Xmx4g"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kbench-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kbench-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_NUM_NETWORK_THREADS: "8"
      KAFKA_NUM_IO_THREADS: "16"
    healthcheck:
      # Each probe starts a JVM inside the broker cgroup, which would pollute broker CPU
      # accounting during runs. Probe quickly during startup only, then effectively never.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kbench-kafka:9092 > /dev/null 2>&1"]
      start_period: 120s
      start_interval: 2s
      interval: 24h
      timeout: 30s
      retries: 3

[package]
name = "kbench-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# librdkafka always bundles snappy and lz4; zlib (gzip) and zstd need these features.
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "libz", "zstd"] }
hdrhistogram = { version = "=7.6.0", default-features = false }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
